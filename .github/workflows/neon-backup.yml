name: Neon Pre-deploy Backup

on:
  push:
    branches:
      - main

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Neon Branch Backup
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          # Generations are named backup/pre-deploy-YYYYMMDD-HHMMSS (JST).
          # The legacy name "backup/pre-deploy" counts as an old generation.
          PREFIX: "backup/pre-deploy"
          KEEP: "2"
        run: |
          API="https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches"

          # 1. Get branches
          echo "Fetching branches for project $PROJECT_ID..."
          RESPONSE=$(curl -s -H "Authorization: Bearer $NEON_API_KEY" "$API")
          if ! echo "$RESPONSE" | jq -e '.branches' > /dev/null; then
            echo "Failed to fetch branches or project ID is incorrect."
            echo "Response: $RESPONSE"
            exit 1
          fi

          PRIMARY_BRANCH_ID=$(echo "$RESPONSE" | jq -r '.branches[] | select(.primary==true) | .id')
          echo "Primary branch ID: $PRIMARY_BRANCH_ID"

          # 2. Create the new generation from production (primary) branch
          NAME="$PREFIX-$(TZ=Asia/Tokyo date +%Y%m%d-%H%M%S)"
          echo "Creating new backup branch $NAME from production..."
          CREATE_RESPONSE=$(curl -X POST -s -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"branch\": {\"name\": \"$NAME\", \"parent_id\": \"$PRIMARY_BRANCH_ID\"}}" \
            "$API")

          if ! echo "$CREATE_RESPONSE" | jq -e '.branch' > /dev/null; then
            # Old generations are kept untouched when the new one could not be created
            echo "Failed to create backup branch."
            echo "Response: $CREATE_RESPONSE"
            exit 1
          fi
          echo "Successfully created backup branch: $NAME ($(echo "$CREATE_RESPONSE" | jq -r '.branch.id'))"

          # 3. Delete generations older than the newest $KEEP (including the one just created)
          STALE=$(echo "$RESPONSE" | jq -c --argjson new "$(echo "$CREATE_RESPONSE" | jq -c '.branch')" \
            --arg prefix "$PREFIX" --argjson keep "$KEEP" '
              [.branches[], $new]
              | map(select(.name == $prefix or (.name | startswith($prefix + "-"))))
              | sort_by(.created_at) | reverse | .[$keep:][]
              | {id, name}')

          if [ -z "$STALE" ]; then
            echo "No old generations to delete."
          fi
          echo "$STALE" | while read -r BRANCH; do
            [ -z "$BRANCH" ] && continue
            ID=$(echo "$BRANCH" | jq -r '.id')
            OLD_NAME=$(echo "$BRANCH" | jq -r '.name')
            echo "Deleting old backup branch $OLD_NAME (ID: $ID)..."
            curl -X DELETE -s -o /dev/null -w "  -> HTTP %{http_code}\n" \
              -H "Authorization: Bearer $NEON_API_KEY" "$API/$ID"
          done
