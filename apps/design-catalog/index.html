<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記事デザインカタログ · Noe Shiftica</title>
  <link rel="stylesheet" href="./catalog.css?v=3">
  <script type="module" src="./catalog.mjs?v=3"></script>
</head>
<body>
  <header class="masthead">
    <div class="identity">
      <div>
        <p class="brand">NOE SHIFTICA <span aria-hidden="true">/</span> DESIGN CATALOG</p>
        <h1>記事デザインカタログ</h1>
      </div>
    </div>
    <div class="file-actions">
      <fieldset class="appearance">
        <legend class="sr-only">画面と記事の配色</legend>
        <label><input type="radio" name="appearance" value="light"><span>ライト</span></label>
        <label><input type="radio" name="appearance" value="dark"><span>ダーク</span></label>
      </fieldset>
      <button id="import" type="button">JSONを読み込む</button>
      <button id="export" type="button" class="primary">JSONで保存</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <main>
    <section class="toolbar" aria-label="比較設定">
      <label class="sample-picker">サンプル記事
        <select id="sample"></select>
      </label>
      <a id="original" class="original" target="_blank" rel="noopener noreferrer">公開記事を開く ↗</a>
      <label>パネル
        <select id="count"><option value="1">1つ</option><option value="2">2つ</option><option value="3">3つ</option></select>
      </label>
      <label class="sync"><input id="sync" type="checkbox"> スクロール同期</label>
      <button id="editor-toggle" type="button" aria-expanded="false" aria-controls="editor">編集パネル</button>
    </section>
    <p id="status" class="status" role="status"></p>
    <div id="workspace" class="workspace">
      <section id="panels" class="panels" aria-label="記事プレビュー"></section>
      <aside id="editor" class="editor" aria-labelledby="editor-title" hidden>
        <header class="editor-header">
          <h2 id="editor-title">編集パネル</h2>
          <button id="editor-close" type="button" aria-label="編集パネルを閉じる">×</button>
        </header>
        <label class="editor-target">編集対象
          <select id="editor-target"></select>
        </label>
        <div id="editor-content"></div>
      </aside>
    </div>
  </main>
  <template id="panel-template">
    <section class="panel">
      <header class="panel-bar">
        <h2></h2>
        <span class="panel-theme"></span>
        <button class="panel-edit" type="button" aria-controls="editor">調整</button>
        <button class="panel-fullscreen" type="button" aria-label="全画面" title="全画面" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path class="fullscreen-enter" d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/>
            <path class="fullscreen-exit" d="M3 9h6V3m6 0v6h6M3 15h6v6m12-6h-6v6"/>
          </svg>
        </button>
      </header>
      <p class="fullscreen-hint" role="status" hidden><kbd>Esc</kbd> キーで全画面を終了</p>
      <div class="preview-scroll" tabindex="0" role="region">
        <div class="spread-track">
          <div class="spread-window">
            <div class="spread-pane spread-left">
              <div class="spread-rail spread-rail-top" aria-hidden="true"></div>
              <div class="spread-clip">
                <div class="spread-stream">
                  <article class="preview">
                    <header class="story-header">
                      <p class="story-kind"></p>
                      <h2 class="story-title"></h2>
                      <p class="story-intro"></p>
                    </header>
                    <figure class="story-hero"><img alt="" fetchpriority="high"></figure>
                    <div class="story-body"></div>
                  </article>
                </div>
              </div>
              <div class="spread-rail spread-rail-bottom" aria-hidden="true"><span>続きは右列の上へ ↗</span></div>
            </div>
            <div class="spread-pane spread-right" aria-hidden="true">
              <div class="spread-rail spread-rail-top" aria-hidden="true"><span>↙ 左列の下から続く</span></div>
              <div class="spread-clip">
                <div class="spread-stream"></div>
              </div>
              <div class="spread-rail spread-rail-bottom" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </template>
  <template id="editor-template">
    <div class="panel-properties">
      <section class="editor-section">
        <h3>表示</h3>
        <div class="display-controls">
          <label class="theme-field">テーマ<select data-field="theme"></select></label>
          <label>列
            <select data-field="layout"><option value="one">1列</option><option value="two">2列</option><option value="auto">幅で切替</option></select>
          </label>
          <label>画面幅
            <select data-field="viewport">
              <option value="0">パネル幅</option><option value="390">スマホ · 390</option>
              <option value="768">iPad縦 · 768</option><option value="1024">iPad横 · 1024</option>
              <option value="1440">PC · 1440</option>
            </select>
          </label>
        </div>
      </section>
      <section class="editor-section">
        <h3>文字と余白</h3>
        <div class="controls"></div>
        <button type="button" data-reset>テーマ初期値に戻す</button>
      </section>
      <section class="editor-section research">
        <h3>デザイン考察</h3>
        <p class="rationale"></p>
        <a class="reference" target="_blank" rel="noopener noreferrer">参照元 ↗</a>
        <label class="note-label">比較メモ<textarea rows="2" maxlength="5000" placeholder="文字の密度、視線の流れ、余白の違いなど"></textarea></label>
      </section>
    </div>
  </template>
</body>
</html>
