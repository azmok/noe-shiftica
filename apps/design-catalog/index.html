<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記事デザインカタログ · Noe Shiftica</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./fonts.css">
  <link rel="stylesheet" href="./article.css">
  <link rel="stylesheet" href="./catalog.css">
  <script type="module" src="./catalog.mjs"></script>
</head>
<body>
  <header class="side">
    <div class="title">
      <p class="brand">Noe Shiftica</p>
      <nav class="views" aria-label="カタログ"><a href="./" aria-current="page">記事</a><a href="./pages.html">ページ</a></nav>
      <h1>記事<br>デザイン<br>カタログ</h1>
    </div>
    <section class="group" aria-label="比較設定">
      <label class="field">サンプル記事<select id="sample"></select></label>
      <a id="original" class="original" target="_blank" rel="noopener noreferrer">公開記事を開く</a>
      <label class="field">並べる数
        <select id="count"><option value="1">1つ</option><option value="2">2つ</option><option value="3">3つ</option></select>
      </label>
      <label class="check"><input id="sync" type="checkbox"><span>スクロールを揃える</span></label>
    </section>
    <section class="group" aria-label="画面">
      <fieldset class="seg appearance">
        <legend>配色</legend>
        <label><input type="radio" name="appearance" value="light"><span>ライト</span></label>
        <label><input type="radio" name="appearance" value="dark"><span>ダーク</span></label>
      </fieldset>
      <button id="editor-toggle" type="button" aria-expanded="false" aria-controls="editor">数値を調整</button>
    </section>
    <section class="group files" aria-label="設定ファイル">
      <button id="import" type="button">読み込む</button>
      <button id="export" type="button" class="primary">JSONで保存</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
    </section>
    <p id="status" class="status" role="status"></p>
  </header>
  <main id="workspace" class="workspace">
    <section id="panels" class="panels" aria-label="記事プレビュー"></section>
    <aside id="editor" class="editor" aria-labelledby="editor-title" hidden>
      <header class="editor-header">
        <h2 id="editor-title">数値を調整</h2>
        <button id="editor-close" type="button" aria-label="調整を閉じる">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <label class="field editor-target">対象<select id="editor-target"></select></label>
      <div id="editor-content"></div>
    </aside>
  </main>
  <template id="panel-template">
    <section class="panel">
      <header class="panel-bar">
        <h2></h2>
        <span class="panel-theme sr-only"></span>
        <div class="seg" data-seg="theme" role="group" aria-label="テーマ"></div>
        <div class="seg" data-seg="viewport" role="group" aria-label="画面幅"></div>
        <div class="panel-actions">
        <button class="panel-edit" type="button" aria-controls="editor">調整</button>
        <button class="panel-fullscreen" type="button" aria-label="全画面" title="全画面" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="fullscreen-enter" d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/>
            <path class="fullscreen-exit" d="M4 9h5V4m6 0v5h5M4 15h5v5m11-5h-5v5"/>
          </svg>
        </button>
        </div>
      </header>
      <p class="fullscreen-hint" role="status" hidden><kbd>Esc</kbd> キーで全画面を終了</p>
      <div class="preview-scroll" tabindex="0" role="region">
        <div class="spread-track">
          <div class="spread-window">
            <div class="spread-pane spread-left">
              <div class="spread-rail spread-rail-top" aria-hidden="true"></div>
              <div class="spread-clip">
                <div class="spread-stream">
                  <article class="preview">
                    <div class="site-bar" aria-hidden="true"><div class="site-in">
                      <span class="site-name">Newsroom</span>
                      <span class="site-link">サービス</span>
                      <span class="site-link">ストーリー</span>
                      <span class="site-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M15.5 15.5L22 22"/></svg>検索</span>
                    </div></div>
                    <header class="story-top">
                      <p class="story-meta"><span class="story-author">投稿： Noe Shiftica</span><span class="dot"> · </span><time class="story-date">2026年11月26日</time><span class="dot"> · </span><span class="story-kind"></span></p>
                      <h2 class="story-title"></h2>
                      <p class="story-intro"></p>
                      <ul class="story-share" aria-hidden="true">
                        <li><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-4M8.6 13.4l6.8 4"/></svg></li>
                        <li><svg viewBox="0 0 24 24"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/></svg></li>
                        <li><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M3 7l9 6.5L21 7"/></svg></li>
                        <li><svg viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3.5-3.5a5 5 0 0 0-7-7L12 5m2 5a5 5 0 0 0-7 0l-3.5 3.5a5 5 0 0 0 7 7L12 19"/></svg></li>
                      </ul>
                      <figure class="story-hero"><img alt="" fetchpriority="high"></figure>
                    </header>
                    <div class="story-main">
                      <aside class="story-aside"><div class="author"><span class="author-mark" aria-hidden="true">NS</span><span><b>Noe Shiftica</b><small>AI × デザインスタジオ</small></span></div><div class="toc-card"><b>目次</b><ol class="toc"></ol></div></aside>
                      <div class="story-body"></div>
                    </div>
                    <footer class="story-after">
                      <ul class="story-docs">
                        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5h8l5 5v14H6zM14 2.5v5h5M9 12h7M9 16h7"/></svg>この記事のテキスト<span class="pill">コピー</span></li>
                        <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 5 5 3-3 5 4"/></svg>この記事の画像<span class="pill">ダウンロード</span></li>
                      </ul>
                      <section class="story-about"><h3>Noe Shifticaについて</h3><p>AIとデザインの力で、本質を設計し、世界観を転換する。デザイン、開発、記事づくりを通して、その過程を発信しています。</p></section>
                      <section class="story-related"><h3>ほかの記事</h3><div class="related-list"></div></section>
                      <p class="story-end">新しい記事を受け取る<span class="pill">一覧を見る</span></p>
                    </footer>
                  </article>
                </div>
              </div>
              <div class="spread-rail spread-rail-bottom" aria-hidden="true"><span>続きは右の列へ</span></div>
            </div>
            <div class="spread-pane spread-right" aria-hidden="true">
              <div class="spread-rail spread-rail-top" aria-hidden="true"><span>左の列から続く</span></div>
              <div class="spread-clip"><div class="spread-stream"></div></div>
              <div class="spread-rail spread-rail-bottom" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </template>
  <template id="editor-template">
    <div class="panel-properties">
      <section class="editor-section">
        <h3>表示</h3>
        <div class="display-controls">
          <label class="field theme-field">テーマ<select data-field="theme"></select></label>
          <label class="field">列
            <select data-field="layout"><option value="one">1列</option><option value="two">2列</option><option value="auto">幅で切替</option></select>
          </label>
          <label class="field">画面幅
            <select data-field="viewport">
              <option value="0">パネル幅</option><option value="390">スマホ 390</option>
              <option value="768">iPad縦 768</option><option value="1024">iPad横 1024</option>
              <option value="1440">PC 1440</option>
            </select>
          </label>
        </div>
      </section>
      <section class="editor-section">
        <h3>文字と余白</h3>
        <div class="controls"></div>
        <button type="button" data-reset>本物の値に戻す</button>
      </section>
      <section class="editor-section research">
        <h3>デザインの要点</h3>
        <p class="rationale"></p>
        <a class="reference" target="_blank" rel="noopener noreferrer">参照元を開く</a>
        <label class="field note-label">比較メモ<textarea rows="3" maxlength="5000" placeholder="文字の密度、視線の流れ、余白の違いなど"></textarea></label>
      </section>
    </div>
  </template>
</body>
</html>
