<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ページデザインカタログ · Noe Shiftica</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./fonts.css">
  <link rel="stylesheet" href="./catalog.css">
  <script type="module" src="./pages.mjs"></script>
</head>
<body>
  <header class="side">
    <div class="title">
      <p class="brand">Noe Shiftica</p>
      <nav class="views" aria-label="カタログ"><a href="./">記事</a><a href="./pages.html" aria-current="page">ページ</a></nav>
      <h1>ページ<br>デザイン<br>カタログ</h1>
    </div>
    <section class="group" aria-label="ページ"><div id="list" class="page-list"></div></section>
    <section class="group" aria-label="表示">
      <fieldset class="seg appearance">
        <legend>サイトの配色</legend>
        <label><input type="radio" name="site" value="dark"><span>ダーク</span></label>
        <label><input type="radio" name="site" value="light"><span>ライト</span></label>
      </fieldset>
      <a id="open" class="original" target="_blank" rel="noopener">見本だけを開く</a>
      <a id="live" class="original" target="_blank" rel="noopener noreferrer">今のサイトを開く</a>
    </section>
  </header>
  <main class="workspace">
    <div class="page-bar">
      <div class="seg" id="styles" role="group" aria-label="テーマ"></div>
      <div class="seg" id="modes" role="group" aria-label="並べ方"></div>
    </div>
    <section id="panels" class="panels"></section>
  </main>
  <template id="panel">
    <section class="panel">
      <header class="panel-bar"><span class="frame-title"></span><span class="frame-size"></span></header>
      <div class="stage"><iframe title=""></iframe></div>
    </section>
  </template>
</body>
</html>
