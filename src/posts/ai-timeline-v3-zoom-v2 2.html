<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
  --bg: #08080e;
  --surface: #0e0e18;
  --border: #181828;
  --text: #dddde8;
  --text-dim: #6a6a82;
  --c-arch: #55efc4;
  --c-llm: #a29bfe;
  --c-image: #00cec9;
  --c-video: #fd79a8;
  --c-event: #ffeaa7;
  --c-discourse: #fab1a0;
  --c-tp: #39ff14;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  overflow: auto;
  cursor: grab;
  user-select: none;
}
body.grabbing { cursor: grabbing; }

/* ── Top Bar (fixed) ── */
.top-bar {
  position: fixed; left: 0; top: 0; z-index: 500;
  width: 100%;
  background: rgba(8,8,14,0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.35s;
}
.top-bar.hidden {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}
.header {
  padding: 16px 32px 8px;
}
.header h1 {
  font-size: 1.4rem; font-weight: 900;
  background: linear-gradient(90deg, var(--c-arch), var(--c-llm), var(--c-image), var(--c-video), var(--c-event), var(--c-discourse));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.header p { color: var(--text-dim); font-size: 0.7rem; margin-top: 3px; }

#scrollHint.hidden{
  display: none;
}

.legend-bar {
  display: flex; flex-wrap: wrap; gap: 14px;
  padding: 6px 32px 12px;
}
.legend-chip { display: flex; align-items: center; gap: 5px; font-size: 0.65rem; color: var(--text-dim); }
.legend-chip .dot { width: 9px; height: 9px; border-radius: 50%; }

/* ── Toggle hint (mobile) ── */
.toggle-hint {
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
  z-index: 510;
  font-size: 0.55rem; color: var(--text-dim);
  background: rgba(14,14,24,0.9);
  padding: 4px 12px; border-radius: 12px;
  border: 1px solid var(--border);
  opacity: 0; pointer-events: none;
  transition: opacity 0.4s;
}
.toggle-hint.visible { opacity: 1; }

/* ── Canvas spacer for fixed header ── */
.canvas-spacer { height: 110px; }
@media (max-width: 768px) {
  .header { padding: 12px 16px 6px; }
  .header h1 { font-size: 1.1rem; }
  .legend-bar { padding: 4px 16px 10px; gap: 10px; }
  .canvas-spacer { height: 100px; }
}

.canvas { position: relative; transform-origin: 0 0; transition: transform 0.15s ease-out; }

.year-col { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--border); }
.year-col-label {
  position: sticky; top: 0; z-index: 100; background: var(--bg);
  font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; font-weight: 600;
  color: #2a2a44; padding: 10px 14px; border-bottom: 1px solid var(--border);
}

.lanes { position: relative; padding-top: 52px; }
.lane { position: relative; border-bottom: 1px solid var(--border); }
.lane-label-wrap {
  position: sticky; left: 0; z-index: 80;
  display: flex; align-items: flex-start;
  padding: 12px 0 12px 20px; width: 120px; height: 100%;
  background: var(--bg); border-right: 3px solid;
}
.lane-label-text {
  writing-mode: vertical-rl; text-orientation: mixed;
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
}

.flow-svg { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }

/* ── Turning Point lines ── */
.tp-line {
  position: absolute; top: 0; z-index: 15;
  border-left: 2px dashed var(--c-tp);
  opacity: 0.7;
}
.tp-label {
  position: absolute; z-index: 16;
  writing-mode: vertical-rl; text-orientation: mixed;
  font-size: 0.6rem; font-weight: 900;
  color: var(--c-tp);
  letter-spacing: 0.15em;
  text-shadow: 0 0 8px var(--c-tp), 0 0 20px rgba(57,255,20,0.3);
  padding: 8px 4px;
}

/* ── Cards ── */
.card { position: absolute; z-index: 20; width: 140px; }
.card.highlight { z-index: 25; }
.card.highlight .card-title {
  text-shadow: 0 0 6px var(--glow), 0 0 14px var(--glow);
}
.card.highlight .card-dot {
  width: 14px; height: 14px;
  box-shadow: 0 0 8px var(--glow), 0 0 20px var(--glow);
}
.card-dot {
  width: 10px; height: 10px; border-radius: 50%;
  margin-bottom: 3px; position: relative;
  box-shadow: 0 0 6px var(--glow);
}
.card-date { font-family: 'JetBrains Mono', monospace; font-size: 0.5rem; color: var(--text-dim); margin-bottom: 1px; }
.card-title { font-size: 0.58rem; font-weight: 700; line-height: 1.35; margin-bottom: 2px; }
.card-body { font-size: 0.48rem; color: var(--text-dim); line-height: 1.45; }
.card-tag {
  display: inline-block; font-size: 1rem; padding: 1px 5px;
  border-radius: 6px; margin-top: 3px; font-weight: 600;
}

/* ── Big Evolution badge ── */
.evo-badge {
  display: inline-block;
  font-size: 0.42rem;
  padding: 1px 5px;
  border-radius: 4px;
  margin-top: 2px;
  font-weight: 900;
  background: linear-gradient(90deg, #ff6b6b, #feca57);
  color: #000;
  letter-spacing: 0.05em;
  animation: evoPulse 2s ease-in-out infinite;
}
@keyframes evoPulse {
  0%,100% { opacity: 0.85; }
  50% { opacity: 1; box-shadow: 0 0 6px rgba(255,107,107,0.5); }
}

.scroll-hint {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 300;
  color: var(--text-dim); font-size: 0.65rem;
  background: rgba(14,14,24,0.92); padding: 5px 14px; border-radius: 16px;
  border: 1px solid var(--border); animation: pulse 2s ease-in-out infinite;
  pointer-events: none; transition: opacity 0.6s;
}
@keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

/* ── Zoom Controls ── */
.zoom-controls {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 400;
  display: flex;
  flex-direction: column;
  gap: 6px;
  user-select: none;
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.35s;
}
.zoom-controls.hidden {
  transform: translateX(80px);
  opacity: 0;
  pointer-events: none;
}
.zoom-btn {
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(14,14,24,0.92);
  backdrop-filter: blur(12px);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.zoom-btn:hover {
  background: rgba(30,30,50,0.95);
  border-color: var(--c-llm);
  box-shadow: 0 0 12px rgba(162,155,254,0.25);
}
.zoom-btn:active {
  transform: scale(0.92);
}
.zoom-btn.reset {
  font-size: 0.55rem;
  letter-spacing: 0.02em;
}
.zoom-level {
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.55rem;
  color: var(--text-dim);
  padding: 2px 0;
}
</style>

// ── Layout ──
const LABEL_W = 130, YEAR_W = 400, CARD_W = 140, CARD_H_EST = 140, LANE_PAD = 18;
const START_YEAR = 2017, END_YEAR = 2026;
const TOTAL_W = LABEL_W + (END_YEAR - START_YEAR + 1) * YEAR_W + 100;
const TOP_PAD = 52;

const laneCounts = {};
CATS.forEach(c => { laneCounts[c.id] = {}; });
DATA.forEach(d => {
  const bucket = d.y + '-' + (d.m <= 4 ? 'a' : d.m <= 8 ? 'b' : 'c');
  laneCounts[d.cat][bucket] = (laneCounts[d.cat][bucket] || 0) + 1;
});
function maxStack(catId) {
  const counts = Object.values(laneCounts[catId]);
  return counts.length ? Math.max(...counts) : 1;
}

const laneHeights = {}, laneYStarts = {};
let cumulY = TOP_PAD;
CATS.forEach(cat => {
  const stacks = maxStack(cat.id);
  const h = Math.max(stacks * (CARD_H_EST + 8) + LANE_PAD * 2, 180);
  laneHeights[cat.id] = h;
  laneYStarts[cat.id] = cumulY;
  cumulY += h;
});
const TOTAL_H = cumulY + 40;

const canvas = document.getElementById('canvas');
const lanesEl = document.getElementById('lanes');
const flowSvg = document.getElementById('flowSvg');

canvas.style.width = TOTAL_W + 'px';
canvas.style.height = TOTAL_H + 'px';
flowSvg.setAttribute('width', TOTAL_W);
flowSvg.setAttribute('height', TOTAL_H);

// Year columns
for (let yr = START_YEAR; yr <= END_YEAR; yr++) {
  const x = LABEL_W + (yr - START_YEAR) * YEAR_W;
  const col = document.createElement('div');
  col.className = 'year-col';
  col.style.left = x + 'px';
  col.innerHTML = `<div class="year-col-label">${yr}</div>`;
  canvas.appendChild(col);
}

// Lanes
CATS.forEach(cat => {
  const lane = document.createElement('div');
  lane.className = 'lane';
  lane.style.height = laneHeights[cat.id] + 'px';
  lane.style.position = 'relative';
  lane.style.background = `linear-gradient(90deg, ${cat.color}06, transparent 30%)`;
  const labelWrap = document.createElement('div');
  labelWrap.className = 'lane-label-wrap';
  labelWrap.style.borderRightColor = cat.color;
  labelWrap.style.float = 'left';
  const labelText = document.createElement('div');
  labelText.className = 'lane-label-text';
  labelText.style.color = cat.color;
  labelText.textContent = cat.label;
  labelWrap.appendChild(labelText);
  lane.appendChild(labelWrap);
  lanesEl.appendChild(lane);
});

function getX(y, m) { return LABEL_W + (y - START_YEAR + (m - 1) / 12) * YEAR_W; }

// ── Turning point lines ──
TPS.forEach(tp => {
  const x = getX(tp.y, tp.m);
  const line = document.createElement('div');
  line.className = 'tp-line';
  line.style.left = x + 'px';
  line.style.height = TOTAL_H + 'px';
  canvas.appendChild(line);

  const label = document.createElement('div');
  label.className = 'tp-label';
  label.style.left = (x + 6) + 'px';
  label.style.top = (TOP_PAD + 10) + 'px';
  label.textContent = tp.label;
  canvas.appendChild(label);
});

// ── Place cards ──
const placed = {};
CATS.forEach(c => { placed[c.id] = []; });

DATA.forEach(item => {
  const cat = CATS.find(c => c.id === item.cat);
  const x = getX(item.y, item.m);
  const laneTop = laneYStarts[item.cat];

  let slotY = laneTop + LANE_PAD;
  for (const p of placed[item.cat]) {
    if (Math.abs(p.x - x) < CARD_W + 10) slotY = Math.max(slotY, p.bottom + 6);
  }

  const card = document.createElement('div');
  card.className = 'card' + (item.evo ? ' highlight' : '');
  card.style.left = x + 'px';
  card.style.top = slotY + 'px';
  card.style.width = CARD_W + 'px';
  card.style.setProperty('--glow', cat.color);

  let evoBadge = item.evo ? '<span class="evo-badge">🔥 大進化</span>' : '';

  card.innerHTML = `
    <div class="card-dot" style="background:${cat.color}"></div>
    <div class="card-date">${item.y}.${String(item.m).padStart(2,'0')}</div>
    <div class="card-title" style="color:${cat.color}">${item.title}</div>
    <div class="card-body">${item.body}</div>
    <span class="card-tag" style="background:${cat.color}18;color:${cat.color}">${item.tag}</span>
    ${evoBadge}
  `;
  canvas.appendChild(card);

  const estH = 35 + item.title.length * 0.9 + item.body.length * 0.55 + 25;
  placed[item.cat].push({ x, top: slotY, bottom: slotY + Math.max(estH, 90) });
});

// ── Flow lines ──
const svgNS = 'http://www.w3.org/2000/svg';
CATS.forEach(cat => {
  const items = DATA.filter(d => d.cat === cat.id).sort((a,b) => (a.y*12+a.m) - (b.y*12+b.m));
  if (items.length < 2) return;
  const midY = laneYStarts[cat.id] + laneHeights[cat.id] / 2;
  for (let i = 0; i < items.length - 1; i++) {
    const x1 = getX(items[i].y, items[i].m), x2 = getX(items[i+1].y, items[i+1].m);
    const cx1 = x1 + (x2-x1)*0.4, cx2 = x1 + (x2-x1)*0.6;
    const bH = 4;
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', `M${x1},${midY-bH} C${cx1},${midY-bH} ${cx2},${midY-bH} ${x2},${midY-bH} L${x2},${midY+bH} C${cx2},${midY+bH} ${cx1},${midY+bH} ${x1},${midY+bH} Z`);
    path.setAttribute('fill', cat.color);
    path.setAttribute('opacity', '0.07');
    flowSvg.appendChild(path);
    const line = document.createElementNS(svgNS, 'path');
    line.setAttribute('d', `M${x1},${midY} C${cx1},${midY} ${cx2},${midY} ${x2},${midY}`);
    line.setAttribute('stroke', cat.color);
    line.setAttribute('stroke-width', '1');
    line.setAttribute('fill', 'none');
    line.setAttribute('opacity', '0.15');
    flowSvg.appendChild(line);
  }
});

// ══════════════════════════════════════
// ── ZOOM SYSTEM ──
// ══════════════════════════════════════
const ZOOM_MIN = 0.3;
const ZOOM_MAX = 3.0;
const ZOOM_STEP = 0.05;
const zoomIn = document.getElementById('zoomIn');
const zoomOut = document.getElementById('zoomOut');
let currentZoom = 0.5;

const zoomLevelEl = document.getElementById('zoomLevel');

function applyZoom(newZoom, centerX, centerY) {
  const oldZoom = currentZoom;
  currentZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));

  canvas.style.transform = `scale(${currentZoom})`;
  zoomLevelEl.textContent = Math.round(currentZoom * 100) + '%';

  if (centerX !== undefined && centerY !== undefined) {
    const ratio = currentZoom / oldZoom;
    const newScrollX = (window.scrollX + centerX) * ratio - centerX;
    const newScrollY = (window.scrollY + centerY) * ratio - centerY;
    window.scrollTo(newScrollX, newScrollY);
  }
}

function init_apply_zoom(){
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  applyZoom(currentZoom, cx, cy);
}
init_apply_zoom();

zoomIn.addEventListener('click', () => {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  applyZoom(currentZoom + ZOOM_STEP, cx, cy);
});

zoomOut.addEventListener('click', () => {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  applyZoom(currentZoom - ZOOM_STEP, cx, cy);
});

document.getElementById('zoomReset').addEventListener('click', () => {
  applyZoom(1.0, window.innerWidth / 2, window.innerHeight / 2);
});

document.querySelectorAll('.zoom-btn').forEach(btn => {
  btn.addEventListener('touchend', (e) => {}, { passive: false });
});

window.addEventListener('wheel', (e) => {
  if (e.ctrlKey || e.metaKey) {
    const delta = -e.deltaY * 0.002;
    applyZoom(currentZoom + delta, e.clientX, e.clientY);
  }
}, { passive: false });

let lastPinchDist = 0;
let pinchCenterX = 0;
let pinchCenterY = 0;

function getPinchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

window.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    lastPinchDist = getPinchDist(e.touches);
    pinchCenterX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    pinchCenterY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
  }
}, { passive: true });

window.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dist = getPinchDist(e.touches);
    const scale = dist / lastPinchDist;
    pinchCenterX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    pinchCenterY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    applyZoom(currentZoom * scale, pinchCenterX, pinchCenterY);
    lastPinchDist = dist;
  }
}, { passive: false });

window.addEventListener('keydown', (e) => {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) {
    applyZoom(currentZoom + ZOOM_STEP, cx, cy);
  } else if ((e.ctrlKey || e.metaKey) && e.key === '-') {
    applyZoom(currentZoom - ZOOM_STEP, cx, cy);
  } else if ((e.ctrlKey || e.metaKey) && e.key === '0') {
    applyZoom(1.0, cx, cy);
  }
});

// ══════════════════════════════════════
// ── DRAG SCROLL SYSTEM (FIXED) ──
// ══════════════════════════════════════
let drag = false, sx, sy, sl, st;
let moved = false; // Flag to track actual movement

document.addEventListener('mousedown', e => {
  if (e.target.closest('a') || e.target.closest('.zoom-controls')) return;
  drag = true;
  moved = false;
  // Use clientX/Y to avoid relative coordinate drift during scroll
  sx = e.clientX; 
  sy = e.clientY;
  sl = window.scrollX;
  st = window.scrollY;
  document.body.classList.add('grabbing');
});

document.addEventListener('mousemove', e => {
  if (!drag) return;
  const dx = e.clientX - sx;
  const dy = e.clientY - sy;

  // Set moved flag if distance exceeds threshold
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
    moved = true;
  }

  window.scrollTo(sl - dx, st - dy);
  e.preventDefault();
});

document.addEventListener('mouseup', () => {
  drag = false;
  document.body.classList.remove('grabbing');
});

// ══════════════════════════════════════
// ── MOBILE & DESKTOP UI TOGGLE ──
// ══════════════════════════════════════
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const topBar = document.getElementById('topBar');
const zoomControls = document.querySelector('.zoom-controls');
const toggleHint = document.getElementById('toggleHint');
const scrollHint = document.getElementById('scrollHint');
let uiVisible = true;
let hinted = true;
let toggleTimeout = null;
let isDragging = false;
let touchStartX = 0;
let touchStartY = 0;

if (isTouchDevice) {
  toggleHint.classList.add('visible');
  setTimeout(() => toggleHint.classList.remove('visible'), 3000);

  document.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isDragging = false;
    }
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1) {
      const dx = Math.abs(e.touches[0].clientX - touchStartX);
      const dy = Math.abs(e.touches[0].clientY - touchStartY);
      if (dx > 10 || dy > 10) isDragging = true;
    }
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if (isDragging) return;
    if (e.target.closest('.zoom-controls') || e.target.closest('.top-bar')) return;
    if (e.changedTouches.length !== 1) return;

    uiVisible = !uiVisible;
    topBar.classList.toggle('hidden', !uiVisible);
    zoomControls.classList.toggle('hidden', !uiVisible);
    scrollHint.classList.toggle('hidden', !uiVisible);

    toggleHint.textContent = uiVisible ? 'UI 表示' : 'UI 非表示（タップで戻す）';
    toggleHint.classList.add('visible');
    clearTimeout(toggleTimeout);
    toggleTimeout = setTimeout(() => toggleHint.classList.remove('visible'), 1500);
  }, { passive: true });
} else {
  // Desktop toggle logic
  document.querySelector('#canvas').addEventListener('click', (e) => {
      // If we just finished dragging, don't toggle UI
      if (moved) return;
      
      uiVisible = !uiVisible;
      hinted = !hinted;
      topBar.classList.toggle('hidden', !uiVisible);
      zoomControls.classList.toggle('hidden', !uiVisible);
      if(scrollHint) scrollHint.classList.toggle('hidden', !hinted);
  });
}

window.addEventListener('scroll', () => {
    if (hinted && window.scrollX > 50) {
        hinted = false;
        if(scrollHint) scrollHint.style.opacity = '0';
    }
});
</script>
