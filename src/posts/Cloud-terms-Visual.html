<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クラウド概念 集合図</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #07070f;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
  }
  h1 {
    color: #e2e8f0;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .sub {
    color: #475569;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 32px;
    letter-spacing: 0.1em;
  }
  canvas {
    max-width: 100%;
    border-radius: 20px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 28px;
    justify-content: center;
    max-width: 780px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #10101a;
    border: 1px solid #1e1e2e;
    border-radius: 8px;
    padding: 8px 14px;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-text {
    font-size: 11px;
    color: #94a3b8;
    font-family: 'IBM Plex Mono', monospace;
  }
  .legend-text strong {
    color: #e2e8f0;
    display: block;
    font-size: 12px;
  }
</style>
</head>
<body>

<h1>クラウドコンピューティング 概念集合図</h1>
<div class="sub">// FaaS · BaaS · DBaaS · Serverless · IaaS · PaaS</div>

<canvas id="c" width="780" height="680"></canvas>

<div class="legend">
  <div class="legend-item">
    <div class="legend-dot" style="background:#3b82f6;opacity:0.8"></div>
    <div class="legend-text"><strong>クラウド全体</strong>インターネット経由でリソースを使う仕組み全般</div>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#a78bfa"></div>
    <div class="legend-text"><strong>サーバーレス</strong>サーバー管理ゼロ・使った分だけ課金</div>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#34d399"></div>
    <div class="legend-text"><strong>FaaS</strong>関数単位で実行・リクエスト時のみ起動</div>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#fb923c"></div>
    <div class="legend-text"><strong>BaaS</strong>認証・ストレージ等バックエンド機能をAPI提供</div>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#f472b6"></div>
    <div class="legend-text"><strong>DBaaS</strong>DBだけをサービスとして提供</div>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#22d3ee"></div>
    <div class="legend-text"><strong>IaaS</strong>仮想サーバー等インフラだけ貸す</div>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#facc15"></div>
    <div class="legend-text"><strong>PaaS</strong>実行環境（OS含む）まで提供</div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── Retina / 高DPI対応 ──────────────────────────
const DPR = window.devicePixelRatio || 1;
const W = 780, H = 680;

// CSSサイズはそのまま、描画バッファだけDPR倍に拡大
canvas.width  = W * DPR;
canvas.height = H * DPR;
canvas.style.width  = W + 'px';
canvas.style.height = H + 'px';
ctx.scale(DPR, DPR);

// ── ユーティリティ ──────────────────────────────
function circle(x, y, r, fillColor, strokeColor, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fillColor) {
    ctx.fillStyle = fillColor;
    ctx.fill();
  }
  if (strokeColor) {
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  ctx.restore();
}

function label(text, x, y, size, color, weight = '700', alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px 'Noto Sans JP', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
  ctx.restore();
}

function monoLabel(text, x, y, size, color, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.font = `600 ${size}px 'IBM Plex Mono', monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
  ctx.restore();
}

function tag(text, x, y, bg, fg) {
  const pad = 10, h = 22;
  ctx.save();
  ctx.font = `600 10px 'IBM Plex Mono', monospace`;
  const tw = ctx.measureText(text).width;
  const bx = x - tw / 2 - pad;
  const by = y - h / 2;
  ctx.beginPath();
  ctx.roundRect(bx, by, tw + pad * 2, h, 5);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.fillStyle = fg;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
  ctx.restore();
}

function service(name, x, y, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `700 11px 'Noto Sans JP', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // dot
  ctx.beginPath();
  ctx.arc(x, y - 1, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillText(name, x, y + 12);
  ctx.restore();
}

// ── 背景 ────────────────────────────────────────
const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
bgGrad.addColorStop(0, '#0e0e1a');
bgGrad.addColorStop(1, '#07070f');
ctx.fillStyle = bgGrad;
ctx.fillRect(0, 0, W, H);

// ── 1. クラウド全体（最外円） ────────────────────
circle(W/2, H/2 + 10, 320, null, 'rgba(59,130,246,0.25)', 1);
// fill with very subtle gradient
const cloudGrad = ctx.createRadialGradient(W/2, H/2+10, 0, W/2, H/2+10, 320);
cloudGrad.addColorStop(0, 'rgba(59,130,246,0.04)');
cloudGrad.addColorStop(1, 'rgba(59,130,246,0.10)');
circle(W/2, H/2+10, 320, cloudGrad, 'rgba(59,130,246,0.30)', 1);

label('クラウドコンピューティング', W/2, 50, 13, 'rgba(147,197,253,0.7)', '700');
monoLabel('Cloud Computing', W/2, 68, 10, 'rgba(147,197,253,0.35)');

// ── 2. IaaS（左下） ───────────────────────────
circle(200, 500, 100, 'rgba(34,211,238,0.06)', 'rgba(34,211,238,0.35)', 1);
label('IaaS', 200, 470, 15, 'rgba(34,211,238,0.9)');
monoLabel('Infra as a Service', 200, 490, 9, 'rgba(34,211,238,0.5)');
service('AWS EC2', 160, 510, 'rgba(34,211,238,0.7)');
service('GCP Compute', 240, 510, 'rgba(34,211,238,0.7)');
service('Azure VM', 200, 535, 'rgba(34,211,238,0.7)');

// ── 3. PaaS（右下） ──────────────────────────
circle(580, 500, 100, 'rgba(250,204,21,0.06)', 'rgba(250,204,21,0.35)', 1);
label('PaaS', 580, 470, 15, 'rgba(250,204,21,0.9)');
monoLabel('Platform as a Service', 580, 490, 9, 'rgba(250,204,21,0.5)');
service('Heroku', 545, 510, 'rgba(250,204,21,0.7)');
service('Railway', 615, 510, 'rgba(250,204,21,0.7)');
service('Render', 580, 535, 'rgba(250,204,21,0.7)');

// ── 4. サーバーレス（大きめ中央上） ──────────────
const slGrad = ctx.createRadialGradient(W/2, 290, 0, W/2, 290, 230);
slGrad.addColorStop(0, 'rgba(167,139,250,0.10)');
slGrad.addColorStop(1, 'rgba(167,139,250,0.03)');
circle(W/2, 290, 230, slGrad, 'rgba(167,139,250,0.40)', 1);
label('サーバーレス', W/2, 100, 15, 'rgba(196,181,253,0.9)');
monoLabel('Serverless', W/2, 118, 10, 'rgba(196,181,253,0.45)');

// ── 5. FaaS（サーバーレス内・左寄り） ────────────
circle(310, 260, 110, 'rgba(52,211,153,0.07)', 'rgba(52,211,153,0.45)', 1);
label('FaaS', 310, 185, 16, 'rgba(52,211,153,0.95)');
monoLabel('Function as a Service', 310, 203, 9, 'rgba(52,211,153,0.5)');

service('Cloud Functions', 280, 235, 'rgba(52,211,153,0.8)');
service('Vercel Functions', 340, 255, 'rgba(52,211,153,0.8)');
service('AWS Lambda', 285, 275, 'rgba(52,211,153,0.8)');
service('Netlify Fn', 345, 295, 'rgba(52,211,153,0.8)');

// FaaS 特性バッジ
tag('リクエスト時のみ起動', 310, 330, 'rgba(52,211,153,0.15)', 'rgba(52,211,153,0.9)');

// ── 6. BaaS（サーバーレス内・右寄り） ────────────
circle(490, 260, 110, 'rgba(251,146,60,0.07)', 'rgba(251,146,60,0.45)', 1);
label('BaaS', 490, 185, 16, 'rgba(251,146,60,0.95)');
monoLabel('Backend as a Service', 490, 203, 9, 'rgba(251,146,60,0.5)');

service('Firebase Auth', 460, 235, 'rgba(251,146,60,0.8)');
service('Cloud Storage', 520, 255, 'rgba(251,146,60,0.8)');
service('Firebase Hosting', 468, 275, 'rgba(251,146,60,0.8)');
service('Supabase', 520, 295, 'rgba(251,146,60,0.8)');

tag('APIで機能を提供', 490, 330, 'rgba(251,146,60,0.15)', 'rgba(251,146,60,0.9)');

// ── 7. DBaaS（サーバーレス内・下中央） ────────────
circle(W/2, 420, 80, 'rgba(244,114,182,0.07)', 'rgba(244,114,182,0.45)', 1);
label('DBaaS', W/2, 385, 14, 'rgba(244,114,182,0.95)');
monoLabel('Database as a Service', W/2, 401, 9, 'rgba(244,114,182,0.5)');

service('Neon', 360, 430, 'rgba(244,114,182,0.8)');
service('PlanetScale', 420, 448, 'rgba(244,114,182,0.8)');
service('Supabase DB', 490, 430, 'rgba(244,114,182,0.8)');
service('MongoDB Atlas', W/2 + 60, 448, 'rgba(244,114,182,0.8)');

// ── 8. コンテナ型（FaaSとBaaSの間、上部） ─────────
circle(W/2, 185, 60, 'rgba(96,165,250,0.07)', 'rgba(96,165,250,0.45)', 1);
label('コンテナ型', W/2, 173, 11, 'rgba(96,165,250,0.95)');
monoLabel('Container', W/2, 188, 9, 'rgba(96,165,250,0.5)');
service('App Hosting', W/2 - 25, 202, 'rgba(96,165,250,0.8)');
service('Cloud Run', W/2 + 30, 202, 'rgba(96,165,250,0.8)');

// ── あずまのスタック吹き出し ──────────────────────
ctx.save();
ctx.globalAlpha = 0.92;

// 矢印線
ctx.strokeStyle = 'rgba(52,211,153,0.5)';
ctx.lineWidth = 1;
ctx.setLineDash([4, 4]);
ctx.beginPath();
ctx.moveTo(640, 200);
ctx.lineTo(570, 230);
ctx.stroke();
ctx.setLineDash([]);

// ボックス
ctx.beginPath();
ctx.roundRect(640, 140, 120, 115, 10);
ctx.fillStyle = 'rgba(10,10,20,0.95)';
ctx.fill();
ctx.strokeStyle = 'rgba(52,211,153,0.5)';
ctx.lineWidth = 1;
ctx.stroke();

ctx.fillStyle = 'rgba(52,211,153,0.9)';
ctx.font = '700 10px "IBM Plex Mono", monospace';
ctx.textAlign = 'left';
ctx.fillText('// Noe Shiftica', 654, 160);

ctx.fillStyle = 'rgba(167,139,250,0.85)';
ctx.font = '600 10px "Noto Sans JP", sans-serif';
ctx.fillText('App Hosting', 654, 180);
ctx.fillText('Cloud Storage', 654, 196);

ctx.fillStyle = 'rgba(244,114,182,0.85)';
ctx.fillText('Neon (PostgreSQL)', 654, 214);

ctx.fillStyle = 'rgba(96,165,250,0.85)';
ctx.fillText('PayloadCMS', 654, 232);

ctx.restore();

// ── CDN注記 ─────────────────────────────────
ctx.save();
ctx.globalAlpha = 0.7;
ctx.beginPath();
ctx.roundRect(26, 140, 100, 50, 8);
ctx.fillStyle = 'rgba(10,10,20,0.9)';
ctx.fill();
ctx.strokeStyle = 'rgba(232,121,249,0.4)';
ctx.lineWidth = 1;
ctx.stroke();
ctx.fillStyle = 'rgba(232,121,249,0.9)';
ctx.font = '700 11px "Noto Sans JP",sans-serif';
ctx.textAlign = 'center';
ctx.fillText('CDN', 76, 158);
ctx.fillStyle = 'rgba(232,121,249,0.6)';
ctx.font = '10px "IBM Plex Mono",monospace';
ctx.fillText('Cloudflare', 76, 175);
ctx.restore();

// ── 「サーバー管理」グラデーション軸 ────────────────
ctx.save();
ctx.globalAlpha = 0.35;
const axisGrad = ctx.createLinearGradient(60, 620, 720, 620);
axisGrad.addColorStop(0, '#22d3ee');
axisGrad.addColorStop(0.5, '#a78bfa');
axisGrad.addColorStop(1, '#34d399');
ctx.strokeStyle = axisGrad;
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(60, 625);
ctx.lineTo(720, 625);
ctx.stroke();

// 矢印
ctx.fillStyle = '#34d399';
ctx.beginPath();
ctx.moveTo(720, 625);
ctx.lineTo(708, 619);
ctx.lineTo(708, 631);
ctx.closePath();
ctx.fill();

ctx.globalAlpha = 0.5;
ctx.fillStyle = '#22d3ee';
ctx.font = '600 10px "IBM Plex Mono",monospace';
ctx.textAlign = 'left';
ctx.fillText('サーバー管理：多い（IaaS）', 62, 645);
ctx.fillStyle = '#34d399';
ctx.textAlign = 'right';
ctx.fillText('サーバー管理：ゼロ（サーバーレス）', 718, 645);
ctx.restore();

// ── タイトル装飾ライン ──────────────────────────
ctx.save();
ctx.globalAlpha = 0.4;
const lineGrad = ctx.createLinearGradient(0, 0, W, 0);
lineGrad.addColorStop(0, 'transparent');
lineGrad.addColorStop(0.3, '#3b82f6');
lineGrad.addColorStop(0.7, '#a78bfa');
lineGrad.addColorStop(1, 'transparent');
ctx.strokeStyle = lineGrad;
ctx.lineWidth = 1;
ctx.beginPath();
ctx.moveTo(0, 88);
ctx.lineTo(W, 88);
ctx.stroke();
ctx.restore();

</script>

</body>
</html>
