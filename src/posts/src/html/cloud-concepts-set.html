<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クラウド概念 集合図</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #07070f;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
  }
  h1 {
    color: #e2e8f0;
    font-size: clamp(15px, 4vw, 22px);
    font-weight: 900;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    text-align: center;
  }
  .sub {
    color: #475569;
    font-size: clamp(10px, 2.5vw, 12px);
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 24px;
    letter-spacing: 0.1em;
    text-align: center;
  }
  .canvas-wrap {
    width: 100%;
    max-width: 780px;
  }
  canvas {
    width: 100%;
    height: auto;
    border-radius: 16px;
    display: block;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 24px;
    justify-content: center;
    max-width: 780px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #10101a;
    border: 1px solid #1e1e2e;
    border-radius: 8px;
    padding: 7px 12px;
  }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-text { font-size: 11px; color: #94a3b8; font-family: 'IBM Plex Mono', monospace; }
  .legend-text strong { color: #e2e8f0; display: block; font-size: 12px; }
</style>
</head>
<body>

<h1>クラウドコンピューティング 概念集合図</h1>
<div class="sub">// FaaS · BaaS · DBaaS · Serverless · IaaS · PaaS</div>

<div class="canvas-wrap">
  <canvas id="c"></canvas>
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-dot" style="background:#3b82f6;opacity:0.8"></div>
    <div class="legend-text"><strong>クラウド全体</strong>インターネット経由でリソースを使う仕組み</div>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#a78bfa"></div>
    <div class="legend-text"><strong>サーバーレス</strong>サーバー管理ゼロ・使った分だけ課金</div>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#34d399"></div>
    <div class="legend-text"><strong>FaaS</strong>関数単位で実行・リクエスト時のみ起動</div>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#fb923c"></div>
    <div class="legend-text"><strong>BaaS</strong>バックエンド機能をAPI提供</div>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#f472b6"></div>
    <div class="legend-text"><strong>DBaaS</strong>DBだけをサービスとして提供</div>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#22d3ee"></div>
    <div class="legend-text"><strong>IaaS</strong>仮想サーバー等インフラだけ貸す</div>
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#facc15"></div>
    <div class="legend-text"><strong>PaaS</strong>実行環境（OS含む）まで提供</div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const BASE_W = 780, BASE_H = 680;

function circle(x, y, r, fillColor, strokeColor) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fillColor) { ctx.fillStyle = fillColor; ctx.fill(); }
  if (strokeColor) { ctx.strokeStyle = strokeColor; ctx.lineWidth = 1.5; ctx.stroke(); }
  ctx.restore();
}

function label(text, x, y, size, color, weight = '700') {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px 'Noto Sans JP', sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
  ctx.restore();
}

function monoLabel(text, x, y, size, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `600 ${size}px 'IBM Plex Mono', monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
  ctx.restore();
}

function tag(text, x, y, bg, fg) {
  const pad = 10, h = 22;
  ctx.save();
  ctx.font = `600 10px 'IBM Plex Mono', monospace`;
  const tw = ctx.measureText(text).width;
  ctx.beginPath();
  ctx.roundRect(x - tw/2 - pad, y - h/2, tw + pad*2, h, 5);
  ctx.fillStyle = bg; ctx.fill();
  ctx.fillStyle = fg;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
  ctx.restore();
}

function service(name, x, y, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y - 1, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.font = `700 11px 'Noto Sans JP', sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(name, x, y + 12);
  ctx.restore();
}

function draw() {
  const W = BASE_W, H = BASE_H;
  ctx.clearRect(0, 0, W, H);

  // 背景
  const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
  bgGrad.addColorStop(0, '#0e0e1a'); bgGrad.addColorStop(1, '#07070f');
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

  // 1. クラウド全体
  const cloudGrad = ctx.createRadialGradient(W/2, H/2+10, 0, W/2, H/2+10, 320);
  cloudGrad.addColorStop(0, 'rgba(59,130,246,0.04)');
  cloudGrad.addColorStop(1, 'rgba(59,130,246,0.10)');
  circle(W/2, H/2+10, 320, cloudGrad, 'rgba(59,130,246,0.30)');
  label('クラウドコンピューティング', W/2, 50, 13, 'rgba(147,197,253,0.7)');
  monoLabel('Cloud Computing', W/2, 68, 10, 'rgba(147,197,253,0.35)');

  // 2. IaaS
  circle(200, 500, 100, 'rgba(34,211,238,0.06)', 'rgba(34,211,238,0.35)');
  label('IaaS', 200, 470, 15, 'rgba(34,211,238,0.9)');
  monoLabel('Infra as a Service', 200, 490, 9, 'rgba(34,211,238,0.5)');
  service('AWS EC2', 160, 510, 'rgba(34,211,238,0.7)');
  service('GCP Compute', 240, 510, 'rgba(34,211,238,0.7)');
  service('Azure VM', 200, 535, 'rgba(34,211,238,0.7)');

  // 3. PaaS
  circle(580, 500, 100, 'rgba(250,204,21,0.06)', 'rgba(250,204,21,0.35)');
  label('PaaS', 580, 470, 15, 'rgba(250,204,21,0.9)');
  monoLabel('Platform as a Service', 580, 490, 9, 'rgba(250,204,21,0.5)');
  service('Heroku', 545, 510, 'rgba(250,204,21,0.7)');
  service('Railway', 615, 510, 'rgba(250,204,21,0.7)');
  service('Render', 580, 535, 'rgba(250,204,21,0.7)');

  // 4. サーバーレス
  const slGrad = ctx.createRadialGradient(W/2, 290, 0, W/2, 290, 230);
  slGrad.addColorStop(0, 'rgba(167,139,250,0.10)');
  slGrad.addColorStop(1, 'rgba(167,139,250,0.03)');
  circle(W/2, 290, 230, slGrad, 'rgba(167,139,250,0.40)');
  label('サーバーレス', W/2, 100, 15, 'rgba(196,181,253,0.9)');
  monoLabel('Serverless', W/2, 118, 10, 'rgba(196,181,253,0.45)');

  // 5. FaaS
  circle(310, 260, 110, 'rgba(52,211,153,0.07)', 'rgba(52,211,153,0.45)');
  label('FaaS', 310, 185, 16, 'rgba(52,211,153,0.95)');
  monoLabel('Function as a Service', 310, 203, 9, 'rgba(52,211,153,0.5)');
  service('Cloud Functions', 280, 235, 'rgba(52,211,153,0.8)');
  service('Vercel Functions', 340, 255, 'rgba(52,211,153,0.8)');
  service('AWS Lambda', 285, 275, 'rgba(52,211,153,0.8)');
  service('Netlify Fn', 345, 295, 'rgba(52,211,153,0.8)');
  tag('リクエスト時のみ起動', 310, 330, 'rgba(52,211,153,0.15)', 'rgba(52,211,153,0.9)');

  // 6. BaaS
  circle(490, 260, 110, 'rgba(251,146,60,0.07)', 'rgba(251,146,60,0.45)');
  label('BaaS', 490, 185, 16, 'rgba(251,146,60,0.95)');
  monoLabel('Backend as a Service', 490, 203, 9, 'rgba(251,146,60,0.5)');
  service('Firebase Auth', 460, 235, 'rgba(251,146,60,0.8)');
  service('Cloud Storage', 520, 255, 'rgba(251,146,60,0.8)');
  service('Firebase Hosting', 468, 275, 'rgba(251,146,60,0.8)');
  service('Supabase', 520, 295, 'rgba(251,146,60,0.8)');
  tag('APIで機能を提供', 490, 330, 'rgba(251,146,60,0.15)', 'rgba(251,146,60,0.9)');

  // 7. DBaaS
  circle(W/2, 420, 80, 'rgba(244,114,182,0.07)', 'rgba(244,114,182,0.45)');
  label('DBaaS', W/2, 385, 14, 'rgba(244,114,182,0.95)');
  monoLabel('Database as a Service', W/2, 401, 9, 'rgba(244,114,182,0.5)');
  service('Neon', 360, 430, 'rgba(244,114,182,0.8)');
  service('PlanetScale', 420, 448, 'rgba(244,114,182,0.8)');
  service('Supabase DB', 490, 430, 'rgba(244,114,182,0.8)');
  service('MongoDB Atlas', W/2+60, 448, 'rgba(244,114,182,0.8)');

  // 8. コンテナ型
  circle(W/2, 185, 60, 'rgba(96,165,250,0.07)', 'rgba(96,165,250,0.45)');
  label('コンテナ型', W/2, 173, 11, 'rgba(96,165,250,0.95)');
  monoLabel('Container', W/2, 188, 9, 'rgba(96,165,250,0.5)');
  service('App Hosting', W/2-25, 202, 'rgba(96,165,250,0.8)');
  service('Cloud Run', W/2+30, 202, 'rgba(96,165,250,0.8)');

  // Noe Shiftica吹き出し
  ctx.save();
  ctx.strokeStyle = 'rgba(52,211,153,0.5)'; ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(640, 200); ctx.lineTo(570, 230); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.roundRect(640, 140, 120, 115, 10);
  ctx.fillStyle = 'rgba(10,10,20,0.95)'; ctx.fill();
  ctx.strokeStyle = 'rgba(52,211,153,0.5)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = 'rgba(52,211,153,0.9)';
  ctx.font = '700 10px "IBM Plex Mono", monospace'; ctx.textAlign = 'left';
  ctx.fillText('// Noe Shiftica', 654, 160);
  ctx.fillStyle = 'rgba(167,139,250,0.85)';
  ctx.font = '600 10px "Noto Sans JP", sans-serif';
  ctx.fillText('App Hosting', 654, 180); ctx.fillText('Cloud Storage', 654, 196);
  ctx.fillStyle = 'rgba(244,114,182,0.85)'; ctx.fillText('Neon (PostgreSQL)', 654, 214);
  ctx.fillStyle = 'rgba(96,165,250,0.85)'; ctx.fillText('PayloadCMS', 654, 232);
  ctx.restore();

  // CDN注記
  ctx.save(); ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.roundRect(26, 140, 100, 50, 8);
  ctx.fillStyle = 'rgba(10,10,20,0.9)'; ctx.fill();
  ctx.strokeStyle = 'rgba(232,121,249,0.4)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = 'rgba(232,121,249,0.9)';
  ctx.font = '700 11px "Noto Sans JP",sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('CDN', 76, 158);
  ctx.fillStyle = 'rgba(232,121,249,0.6)';
  ctx.font = '10px "IBM Plex Mono",monospace'; ctx.fillText('Cloudflare', 76, 175);
  ctx.restore();

  // サーバー管理軸
  ctx.save(); ctx.globalAlpha = 0.35;
  const axisGrad = ctx.createLinearGradient(60, 620, 720, 620);
  axisGrad.addColorStop(0, '#22d3ee'); axisGrad.addColorStop(0.5, '#a78bfa'); axisGrad.addColorStop(1, '#34d399');
  ctx.strokeStyle = axisGrad; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(60, 625); ctx.lineTo(720, 625); ctx.stroke();
  ctx.fillStyle = '#34d399';
  ctx.beginPath(); ctx.moveTo(720,625); ctx.lineTo(708,619); ctx.lineTo(708,631); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#22d3ee'; ctx.font = '600 10px "IBM Plex Mono",monospace'; ctx.textAlign = 'left';
  ctx.fillText('サーバー管理：多い（IaaS）', 62, 645);
  ctx.fillStyle = '#34d399'; ctx.textAlign = 'right';
  ctx.fillText('サーバー管理：ゼロ（サーバーレス）', 718, 645);
  ctx.restore();

  // タイトル装飾ライン
  ctx.save(); ctx.globalAlpha = 0.4;
  const lineGrad = ctx.createLinearGradient(0, 0, W, 0);
  lineGrad.addColorStop(0, 'transparent'); lineGrad.addColorStop(0.3, '#3b82f6');
  lineGrad.addColorStop(0.7, '#a78bfa'); lineGrad.addColorStop(1, 'transparent');
  ctx.strokeStyle = lineGrad; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 88); ctx.lineTo(W, 88); ctx.stroke();
  ctx.restore();
}

// ── レスポンシブ：画面幅 × DPR でスケール ──────────
function resize() {
  const DPR = window.devicePixelRatio || 1;
  const wrap = canvas.parentElement;
  const cssW = wrap.clientWidth;
  const cssH = Math.round(cssW * BASE_H / BASE_W);
  const scale = cssW / BASE_W;

  canvas.width  = cssW * DPR;
  canvas.height = cssH * DPR;
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';

  ctx.setTransform(DPR * scale, 0, 0, DPR * scale, 0, 0);
  draw();
}

new ResizeObserver(() => resize()).observe(canvas.parentElement);
resize();
</script>
</body>
</html>
